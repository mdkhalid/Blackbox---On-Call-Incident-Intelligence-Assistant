name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENV: dev
      DATABASE_URL: sqlite:///./ci.db
      REDIS_URL: ""
      CONFIG_PATH: blackbox/config/config.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,rag,db]"
      - name: Lint
        run: python -m ruff check blackbox tests scripts alembic
      - name: Type check
        run: python -m mypy blackbox
      - name: Tests
        run: python -m pytest -q
      - name: Retrieval eval parity gate
        run: python -m blackbox.eval.retrieval_eval --k 5 --min-mrr 0.9167
      - name: Migration check
        run: |
          alembic upgrade head
          alembic downgrade base
