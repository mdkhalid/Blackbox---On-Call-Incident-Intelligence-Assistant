# Assembles the chart's `existingSecret` from the Terraform-managed secrets.
#
# Replace `blackbox-prod` with `<project_name>-<environment>` and
# `rds!cluster-...` with the `database_master_secret_arn` output. Apply after the
# External Secrets Operator and a ClusterSecretStore named
# `aws-secrets-manager` exist (see README.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: blackbox-secrets
  namespace: blackbox
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: blackbox-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTH_JWT_SECRET: "{{ .AUTH_JWT_SECRET }}"
        OPENAI_API_KEY: '{{ .OPENAI_API_KEY | default "" }}'
        REDIS_URL: "{{ .REDIS_URL }}"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        # RDS manages this credential and may rotate it; urlquery keeps a
        # password containing `/`, `+` or `@` a valid URL component.
        DATABASE_URL: 'postgresql://{{ .username }}:{{ urlquery .password }}@{{ .host }}:{{ .port }}/blackbox?sslmode=require'

  dataFrom:
    # `<project>-<env>/app` → AUTH_JWT_SECRET, optional OPENAI_API_KEY.
    - extract:
        key: blackbox-prod/app
    # `<project>-<env>/redis` → REDIS_URL (rediss:// with the auth token).
    - extract:
        key: blackbox-prod/redis
    # RDS-managed master credential → username, password, host, port.
    - extract:
        key: rds!cluster-00000000-0000-0000-0000-000000000000
