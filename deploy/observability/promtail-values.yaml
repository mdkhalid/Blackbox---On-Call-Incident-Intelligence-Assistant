# Promtail values for the grafana/promtail Helm chart.
#
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install promtail grafana/promtail -n monitoring \
#     -f deploy/observability/promtail-values.yaml
#
# The API logs one JSON object per line with `level`, `request_id` and (when tracing is
# enabled) `trace_id`. Extracting those as labels makes the Loki -> Tempo derived field
# work without a per-query parser.

config:
  clients:
    - url: http://loki.monitoring.svc:3100/loki/api/v1/push

  snippets:
    # Keep only the Blackbox namespace; this is a reference, not a cluster-wide agent.
    scrapeConfigs: |
      - job_name: blackbox
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: blackbox
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

    pipelineStages:
      - cri: {}
      - json:
          expressions:
            level: level
            request_id: request_id
            trace_id: trace_id
            event: event
      - labels:
          level:
          trace_id:
      - timestamp:
          source: timestamp
          format: RFC3339Nano