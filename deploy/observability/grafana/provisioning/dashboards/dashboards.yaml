# Grafana dashboard provider. Mount at /etc/grafana/provisioning/dashboards/ and mount
# deploy/observability/grafana/dashboards at the path below (ConfigMap or Grafana chart
# `dashboards` values).

apiVersion: 1

providers:
  - name: blackbox
    orgId: 1
    folder: Blackbox
    folderUid: blackbox
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false