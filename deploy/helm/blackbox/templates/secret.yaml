{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "blackbox.fullname" . }}-secret
  labels:
    {{- include "blackbox.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.stringData }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
