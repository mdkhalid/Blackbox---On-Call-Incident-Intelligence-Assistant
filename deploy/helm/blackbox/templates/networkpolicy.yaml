{{- if .Values.networkPolicy.enabled }}
# The rules below are additive: this policy selects our pods and *allows* the
# traffic listed. It does not implicitly deny traffic allowed by other policies in
# the namespace, so pair it with a default-deny policy if that is the intent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blackbox.fullname" . }}-api
  labels:
    {{- include "blackbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blackbox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with .Values.networkPolicy.api.ingress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    # DNS first: without it every other egress rule is unusable.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.api.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "blackbox.fullname" . }}-worker
  labels:
    {{- include "blackbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "blackbox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.worker.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
