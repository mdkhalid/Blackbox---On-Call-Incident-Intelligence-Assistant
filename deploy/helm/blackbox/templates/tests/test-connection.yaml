apiVersion: v1
kind: Pod
metadata:
  name: {{ include "blackbox.fullname" . }}-test-connection
  labels:
    {{- include "blackbox.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
    - name: curl
      image: curlimages/curl:8.7.1
      command:
        - sh
        - -c
        - curl -fsS "http://{{ include "blackbox.fullname" . }}:{{ .Values.service.port }}/health"
