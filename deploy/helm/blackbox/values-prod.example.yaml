# Production example — copy and edit; do not deploy as-is.
#
#   helm upgrade --install blackbox deploy/helm/blackbox \
#     -n blackbox --create-namespace \
#     -f deploy/helm/blackbox/values-prod.example.yaml

image:
  repository: ghcr.io/example/blackbox
  tag: "0.1.0"

# External Secrets / Sealed Secrets / SOPS. Must contain at least:
#   DATABASE_URL, REDIS_URL, OPENAI_API_KEY (or ANTHROPIC_API_KEY),
#   AUTH_JWT_SECRET (or AUTH_JWKS_URL), OPENSEARCH_PASSWORD
existingSecret: blackbox-secrets

config:
  ENV: prod
  LOG_LEVEL: INFO
  AUTH_ENABLED: "true"
  AUTH_JWT_ISSUER: https://login.example.com/
  AUTH_JWT_AUDIENCE: blackbox
  # The load balancer / ingress controller networks, not 0.0.0.0/0.
  TRUSTED_PROXY_CIDRS: 10.0.0.0/16
  CORS_ORIGINS: https://blackbox.example.com
  QDRANT_URL: http://qdrant.blackbox.svc:6333
  OPENSEARCH_HOSTS: https://opensearch.blackbox.svc:9200
  OPENSEARCH_INDEX: blackbox_chunks
  TRACE_ARCHIVE_BACKEND: s3
  TRACE_ARCHIVE_BUCKET: example-blackbox-traces
  TRACE_ARCHIVE_REGION: eu-west-1
  LLM_MAX_CONCURRENCY: "16"
  # Traces go to the OTel Collector, which fans out to Tempo (see
  # deploy/observability). Sample 10% of root turns; upstream sampling is respected.
  OTEL_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc:4318
  OTEL_TRACES_SAMPLER_ARG: "0.1"

serviceAccount:
  create: true
  annotations:
    # IRSA for S3 trace archive access. Scope the policy to the bucket prefix.
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/blackbox

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-body-size: "32768"
  hosts:
    - host: blackbox.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: blackbox-tls
      hosts:
        - blackbox.example.com

api:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 30
    targetCPUUtilizationPercentage: 65
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

worker:
  replicaCount: 1
  keda:
    enabled: true
    minReplicaCount: 1
    maxReplicaCount: 20
    address: blackbox-redis.example.cache.amazonaws.com:6379
    tls: true
    queueLength: 3
    # Create a TriggerAuthentication in the namespace with the Redis password.
    authenticationRef: blackbox-redis-auth

migration:
  enabled: true

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack

# Requires a default-deny policy in the namespace as well; these rules only allow
# traffic to the pods selected here.
networkPolicy:
  enabled: true
  api:
    ingress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: ingress-nginx
        ports:
          - protocol: TCP
            port: 8000
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
        ports:
          - protocol: TCP
            port: 8000
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: blackbox
        ports:
          - protocol: TCP
            port: 5432
          - protocol: TCP
            port: 6379
          - protocol: TCP
            port: 9200
          - protocol: TCP
            port: 6333
      - to:
          # OTLP/HTTP to the collector when OTEL_ENABLED=true.
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: monitoring
        ports:
          - protocol: TCP
            port: 4318
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 169.254.169.254/32
        ports:
          - protocol: TCP
            port: 443
  worker:
    egress:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: blackbox
        ports:
          - protocol: TCP
            port: 5432
          - protocol: TCP
            port: 6379
          - protocol: TCP
            port: 9200
          - protocol: TCP
            port: 6333
      - to:
          - ipBlock:
              cidr: 0.0.0.0/0
              except:
                - 169.254.169.254/32
        ports:
          - protocol: TCP
            port: 443
