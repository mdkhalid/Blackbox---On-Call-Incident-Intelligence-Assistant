# Default values for the Blackbox chart.
#
# Production deployments set `ENV: prod` (the app refuses prod without auth and a
# provider key). Secrets are never rendered by this chart unless `secret.create` is
# explicitly enabled — use `existingSecret` (External Secrets / Sealed Secrets / SOPS).

nameOverride: ""
fullnameOverride: ""

image:
  repository: blackbox
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  # Defaults to the fullname when empty.
  name: ""
  annotations: {}
  # For EKS IRSA:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/blackbox

podAnnotations: {}
podLabels: {}

# Pods run unprivileged. The container writes only /app/data (Chroma in dev); a
# production deployment points retrieval at external stores instead.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

# ---- non-secret configuration -------------------------------------------------
# Rendered into a ConfigMap and injected with envFrom. Values are stringified.
# Sensitive values (DATABASE_URL with a password, REDIS_URL, API keys, JWT secret)
# belong in the Secret, not here.
config:
  ENV: prod
  LOG_LEVEL: INFO
  CONFIG_PATH: blackbox/config/config.yaml
  AUTH_ENABLED: "true"
  AUTH_JWT_ISSUER: ""
  AUTH_JWT_AUDIENCE: ""
  AUTH_DEFAULT_TENANT: default
  # The ingress controller / load balancer networks. X-Forwarded-For is honoured
  # only from these peers, so a spoofed header cannot bypass the rate limiter.
  TRUSTED_PROXY_CIDRS: ""
  # Must be an explicit allowlist in prod; "*" is rejected by settings validation.
  CORS_ORIGINS: ""
  # Optional external retrieval backends. Leave empty to use the in-pod dev adapters.
  QDRANT_URL: ""
  OPENSEARCH_HOSTS: ""
  OPENSEARCH_INDEX: blackbox_chunks
  OPENSEARCH_VERIFY_CERTS: "true"
  # Cold trace storage: none | file | s3.
  TRACE_ARCHIVE_BACKEND: none
  TRACE_ARCHIVE_DIR: /app/data/traces
  TRACE_ARCHIVE_BUCKET: ""
  TRACE_ARCHIVE_PREFIX: traces
  LLM_TIMEOUT_S: "30"
  LLM_MAX_RETRIES: "2"
  LLM_MAX_CONCURRENCY: "8"
  MAX_WORKER_THREADS: "32"

# Name of an existing Secret containing sensitive env vars. Recommended in prod.
existingSecret: ""

# Not recommended for production; provided so a demo install can be self-contained.
secret:
  create: false
  stringData: {}
  # stringData:
  #   DATABASE_URL: postgresql://blackbox:...@aurora:5432/blackbox
  #   REDIS_URL: redis://elasticache:6379/0
  #   OPENAI_API_KEY: sk-...
  #   AUTH_JWT_SECRET: ...

# ---- API ----------------------------------------------------------------------

api:
  replicaCount: 3
  containerPort: 8000
  terminationGracePeriodSeconds: 60

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  # Eleven seconds is not arbitrary: the readiness probe must observe the pod as
  # not-ready while the load balancer drains, then the SSE turn gets the rest of
  # the grace period to finish.
  lifecycle:
    preStop:
      exec:
        command: ["sh", "-c", "sleep 10"]

  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      cpu: "2"
      memory: 2Gi

  probes:
    startup:
      path: /health
      periodSeconds: 2
      timeoutSeconds: 2
      failureThreshold: 30
    readiness:
      path: /health/ready
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      path: /health
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    # Override with custom metrics (for example the SSE gauge exposed through
    # prometheus-adapter) to scale on active streams instead of CPU alone.
    metrics: []
    # metrics:
    #   - type: Pods
    #     pods:
    #       metric:
    #         name: blackbox_sse_active_streams
    #       target:
    #         type: AverageValue
    #         averageValue: "50"

  podDisruptionBudget:
    enabled: true
    minAvailable: 2

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels: {}
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraEnvFrom: []

# ---- background worker --------------------------------------------------------
# Consumes the shared Redis job queue (ingest, eval, retention). The API can run a
# job in-process, but a dedicated worker survives the pod that submitted it.

worker:
  replicaCount: 1
  terminationGracePeriodSeconds: 120

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1

  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  extraEnvFrom: []

  # KEDA scales the worker on the Redis pending-list length. With a shared queue,
  # queue depth is the only signal that reflects work submitted by other pods.
  keda:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 15
    cooldownPeriod: 300
    queueLength: 5
    # host:port, not a URL (KEDA's Redis scaler contract).
    address: ""
    tls: false
    queueKinds:
      - ingest
      - eval
      - retention
    # Prefer a TriggerAuthentication over putting a password in values.
    authenticationRef: ""

# ---- service / ingress --------------------------------------------------------

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations:
    # SSE must not be buffered; the idle timeout must exceed the longest turn.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # Keep aligned with guardrails.max_request_bytes (32 KiB).
    nginx.ingress.kubernetes.io/proxy-body-size: "32768"
  hosts:
    - host: blackbox.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ---- database migrations ------------------------------------------------------

migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources: {}
  # Runs as a pre-install/pre-upgrade Helm hook with `alembic upgrade head`.
  # A failed migration blocks the rollout: the old pods keep serving.

# ---- policy -------------------------------------------------------------------

# Disabled by default because the allowlist depends on your cluster's namespaces
# and store addresses. The prod example enables it with a realistic policy.
networkPolicy:
  enabled: false
  api:
    ingress: []
    egress: []
  worker:
    egress: []

# ---- observability ------------------------------------------------------------

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  path: /metrics
  labels: {}
