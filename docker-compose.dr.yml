# Two-region DR drill harness (reference, not production).
#
#   docker compose -f docker-compose.dr.yml up -d
#   python scripts/dr_drill.py --write
#
# It stands up a Postgres primary, a streaming replica, one Redis and two API
# instances labelled as different regions. The replica starts read-only; promotion is
# `scripts/dr/promote.sh`, which is the manual step a real failover runbook performs.
services:
  postgres-primary:
    image: postgres:16-alpine
    container_name: blackbox-dr-primary
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - hot_standby=on
    environment:
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox
      POSTGRES_DB: blackbox
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbox -d blackbox"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:16-alpine
    container_name: blackbox-dr-replica
    entrypoint: ["/bin/sh", "/scripts/replica-entrypoint.sh"]
    environment:
      PRIMARY_HOST: postgres-primary
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./deploy/dr:/scripts:ro
      - replica-data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: blackbox-dr-redis
    ports:
      - "6379:6379"

  # Region A: writes are allowed here for tenants homed in eu-west-1.
  api-a:
    build: .
    container_name: blackbox-dr-api-a
    environment:
      - ENV=dev
      - REGION=eu-west-1
      - DEFAULT_HOME_REGION=eu-west-1
      - REGION_WRITE_PINNING=true
      - DATABASE_URL=postgresql://blackbox:blackbox@postgres-primary:5432/blackbox
      - REDIS_URL=redis://redis:6379/0
      - CONFIG_PATH=blackbox/config/config.yaml
    ports:
      - "8001:8000"
    depends_on:
      postgres-primary:
        condition: service_healthy

  # Region B: points at the replica. Until it is promoted it is read-only; after
  # promotion it serves writes for tenants moved or failed over to us-east-1.
  api-b:
    build: .
    container_name: blackbox-dr-api-b
    environment:
      - ENV=dev
      - REGION=us-east-1
      - DEFAULT_HOME_REGION=eu-west-1
      - REGION_WRITE_PINNING=true
      - DATABASE_URL=postgresql://blackbox:blackbox@postgres-replica:5432/blackbox
      - REDIS_URL=redis://redis:6379/0
      - CONFIG_PATH=blackbox/config/config.yaml
    ports:
      - "8002:8000"
    depends_on:
      postgres-replica:
        condition: service_started

volumes:
  replica-data:
