[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox"
version = "0.1.0"
description = "Blackbox - On-Call Incident Intelligence Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4",
    "httpx>=0.27,<0.28",
    "ruff>=0.5",
    "mypy>=1.10",
]
# later phases
rag = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.7",
    "numpy>=1.26",
]
# optional: cross-encoder reranking (needs torch)
rerank = [
    "sentence-transformers>=3.0",
]
# optional: the sparse retrieval backend that scales past a single pod
search = [
    "opensearch-py>=3.0",
]
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
]
llm = [
    "openai>=1.40",
    "anthropic>=0.34",
    "sentence-transformers>=3.0",
]
# docs: regenerate docs/architecture.png via scripts/render_architecture.py
docs = [
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["blackbox*"]

[tool.setuptools.package-data]
blackbox = ["config/*.yaml", "eval/*.json", "api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["blackbox"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
show_error_codes = true

# Optional dependencies ship without type information. They are imported lazily so the
# graph, tests and the offline demo run without them installed; the stubs are not
# worth vendoring, so the imports are typed as `Any` instead.
[[tool.mypy.overrides]]
module = [
    "anthropic.*",
    "chromadb.*",
    "openai.*",
    "opensearchpy.*",
    "rank_bm25.*",
    "redis.*",
    "sentence_transformers.*",
    "yaml.*",
]
ignore_missing_imports = true
